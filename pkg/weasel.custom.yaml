# 青石五笔 · 外观设置
# 由设置中心生成，手工修改会在下次保存时被覆盖
patch:
  style:
    color_scheme: qingshi_blue
    color_scheme_dark: qingshi_blue
    font_face: "Microsoft YaHei"
    label_font_face: "Microsoft YaHei"
    comment_font_face: "Microsoft YaHei"
    font_point: 13
    horizontal: true
    inline_preedit: true
    layout:
      round_corner: 6
      corner_radius: 6
      border_width: 1
      margin_x: 10
      margin_y: 8
      spacing: 8
      candidate_spacing: 4
      hilite_spacing: 3
      hilite_padding: 2
      shadow_radius: 6
  preset_color_schemes:
    qingshi_blue:
      name: "青石蓝白"
      author: "青石五笔"
      color_format: argb
      back_color: 0xFFFFFF
      border_color: 0xDCE5F1
      text_color: 0x263750
      hilited_text_color: 0x263750
      hilited_back_color: 0xFFFFFF
      hilited_candidate_text_color: 0xFFFFFF
      hilited_candidate_back_color: 0x2868D7
      candidate_text_color: 0x263750
      candidate_back_color: 0xFFFFFF
      comment_text_color: 0x718198
      label_color: 0x718198
      hilited_candidate_label_color: 0xFFFFFF
