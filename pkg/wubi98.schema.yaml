# Rime schema: wubi98
# 五笔字型五笔98，纯码表模式（不造句、不自动造词，严格保持码表顺序）
schema:
  schema_id: wubi98
  name: "五笔98"
  version: "1.0"
  author:
    - 發明人 王永民先生
  description: |
    五笔字型五笔98
    码表：98版原表
    纯码表模式：enable_sentence=false, enable_encoder=false

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: extended_charset
    reset: 0
    states: [ 常用, 增廣 ]
  - name: traditional
    reset: 0
    states: [ 简体, 繁体 ]
  - name: ascii_punct
    reset: 0
    states: [ 中文标点, 英文标点 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - selector
    - punctuator
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - table_translator
  filters:
    - simplifier@traditional

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " "
  max_code_length: 4

translator:
  dictionary: wubi98
  enable_charset_filter: true
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  max_phrase_length: 4
  disable_user_dict_for_patterns:
    - "^z.*$"

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default
  bindings:
    - { when: always, accept: Control+Shift+F, toggle: traditional }
    - { when: always, accept: Control+Shift+T, toggle: traditional }
    - { when: always, accept: Shift+space, toggle: full_shape }
    - { when: always, accept: Control+period, toggle: ascii_punct }
    - { when: always, accept: Control+Shift+5, toggle: extended_charset }

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'

# 简繁转换：OpenCC 简体 → 繁体（Ctrl+Shift+F 或 Ctrl+Shift+T 切换）
traditional:
  opencc_config: s2t.json
  option_name: traditional
  tips: all

# 自定义词条：来自 custom_phrase.txt，权重高，排在候选最前
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

# Shift 键行为：按 Shift 时把已输入的编码直接上屏为字母
# 大写字母本身仍直接上屏、不进候选
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

# 候选词快捷键：1=第1候选，;=第2候选，'=第3候选
menu:
  alternative_select_keys: "1;'"
